<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Magnet Collector</title>
    <style>
      body {
        box-sizing: border-box;
        width: 360px;
        margin: 0;
        padding: 12px;
        font-family: Arial, sans-serif;
        color: #202124;
      }

      button {
        width: 100%;
        min-height: 36px;
        margin-bottom: 8px;
        border: 1px solid #1a73e8;
        border-radius: 4px;
        background: #1a73e8;
        color: #fff;
        font-size: 14px;
        cursor: pointer;
      }

      button.secondary {
        border-color: #5f6368;
        background: #fff;
        color: #202124;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.7;
      }

      #status {
        margin: 10px 0;
        min-height: 18px;
        font-size: 13px;
      }

      textarea {
        box-sizing: border-box;
        width: 100%;
        height: 180px;
        resize: vertical;
        border: 1px solid #dadce0;
        border-radius: 4px;
        padding: 8px;
        font-family: Consolas, monospace;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <button id="open-first-five" class="secondary">Open First 5 Detail Links</button>
    <button id="collect">Collect and Copy</button>
    <div id="status"></div>
    <textarea id="output" readonly></textarea>
    <script src="popup.js"></script>
  </body>
</html>
